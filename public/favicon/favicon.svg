<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1012"/>
      <stop offset="1" stop-color="#0e0a0b"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2A36"/>
      <stop offset="1" stop-color="#B3121C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF2A36" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF2A36" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#FF2A36" stroke-opacity="0.35" stroke-width="6"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>

  <g stroke="url(#stroke)" stroke-width="30" stroke-linecap="round" fill="none">
    <!-- outer reticle ring with gaps -->
    <circle cx="256" cy="256" r="138" stroke-dasharray="150 67"/>
    <!-- crosshair ticks -->
    <line x1="256" y1="40"  x2="256" y2="118"/>
    <line x1="256" y1="394" x2="256" y2="472"/>
    <line x1="40"  y1="256" x2="118" y2="256"/>
    <line x1="394" y1="256" x2="472" y2="256"/>
  </g>

  <!-- center lock -->
  <circle cx="256" cy="256" r="38" fill="url(#stroke)"/>
  <circle cx="256" cy="256" r="14" fill="#0e0a0b"/>
</svg>