<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <radialGradient id="bg-ctf" cx="70%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#5c4a00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-ctf" cx="60%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <!-- Japanese-style pattern -->
    <pattern id="pattern-ctf" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30,0 L60,30 L30,60 L0,30 Z" fill="none" stroke="#ffd700" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  
  <!-- Dark base -->
  <rect width="900" height="300" fill="#0d0d0f"/>
  
  <!-- Radial gradient background -->
  <rect width="900" height="300" fill="url(#bg-ctf)"/>
  
  <!-- Geometric pattern overlay -->
  <rect width="900" height="300" fill="url(#pattern-ctf)"/>
  
  <!-- Atmospheric glow -->
  <rect width="900" height="300" fill="url(#glow-ctf)"/>
  
  <!-- Japanese kanji-style decorative marks -->
  <g opacity="0.06" fill="#ffd700">
    <text x="100" y="280" font-size="120" font-family="serif" transform="rotate(-15,100,280)">武</text>
    <text x="650" y="100" font-size="80" font-family="serif" transform="rotate(10,650,100)">忍</text>
  </g>
  
  <!-- Smoke/mist effect -->
  <ellipse cx="450" cy="280" rx="400" ry="60" fill="#ffd700" opacity="0.05"/>
  <ellipse cx="300" cy="290" rx="250" ry="40" fill="#ffd700" opacity="0.03"/>
  
  
    <!-- Warrior with dual weapons -->
    <g transform="translate(370,100)" opacity="0.3">
      <!-- Head with helmet -->
      <path d="M40,-10 C30,-20 30,-40 50,-45 C70,-40 70,-20 60,-10" fill="#ffd700" opacity="0.5"/>
      <path d="M35,-25 L65,-25" stroke="#ffd700" stroke-width="3" opacity="0.6"/>
      <!-- Body armor -->
      <path d="M30,0 L15,80 L35,140 L50,150 L65,140 L85,80 L70,0 Z" fill="#ffd700" opacity="0.4"/>
      <!-- Left sword -->
      <path d="M25,20 L-60,-60 L-65,-55 L20,25 Z" fill="#ffd700" opacity="0.7"/>
      <!-- Right sword -->
      <path d="M75,20 L160,-60 L165,-55 L80,25 Z" fill="#ffd700" opacity="0.7"/>
      <!-- Legs -->
      <path d="M35,140 L20,240 L35,245 L50,150" fill="#ffd700" opacity="0.3"/>
      <path d="M65,140 L80,240 L65,245 L50,150" fill="#ffd700" opacity="0.3"/>
    </g>
    
  
  <!-- Particle effects -->
  <circle cx="150" cy="50" r="1.5" fill="#ffd700" opacity="0.3"/>
  <circle cx="700" cy="80" r="1" fill="#ffd700" opacity="0.4"/>
  <circle cx="250" cy="180" r="2" fill="#ffd700" opacity="0.2"/>
  <circle cx="800" cy="200" r="1.5" fill="#ffd700" opacity="0.3"/>
  <circle cx="500" cy="30" r="1" fill="#ffd700" opacity="0.5"/>
</svg>