<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <radialGradient id="bg-defensive" cx="70%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a3a5c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glow-defensive" cx="60%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <!-- Japanese-style pattern -->
    <pattern id="pattern-defensive" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30,0 L60,30 L30,60 L0,30 Z" fill="none" stroke="#4a9eff" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  
  <!-- Dark base -->
  <rect width="900" height="300" fill="#0d0d0f"/>
  
  <!-- Radial gradient background -->
  <rect width="900" height="300" fill="url(#bg-defensive)"/>
  
  <!-- Geometric pattern overlay -->
  <rect width="900" height="300" fill="url(#pattern-defensive)"/>
  
  <!-- Atmospheric glow -->
  <rect width="900" height="300" fill="url(#glow-defensive)"/>
  
  <!-- Japanese kanji-style decorative marks -->
  <g opacity="0.06" fill="#4a9eff">
    <text x="100" y="280" font-size="120" font-family="serif" transform="rotate(-15,100,280)">武</text>
    <text x="650" y="100" font-size="80" font-family="serif" transform="rotate(10,650,100)">忍</text>
  </g>
  
  <!-- Smoke/mist effect -->
  <ellipse cx="450" cy="280" rx="400" ry="60" fill="#4a9eff" opacity="0.05"/>
  <ellipse cx="300" cy="290" rx="250" ry="40" fill="#4a9eff" opacity="0.03"/>
  
  
    <!-- Ninja in defensive stance -->
    <g transform="translate(380,120)" opacity="0.3">
      <!-- Head -->
      <circle cx="50" cy="15" r="25" fill="#4a9eff" opacity="0.5"/>
      <!-- Mask detail -->
      <path d="M30,15 Q50,25 70,15" stroke="#4a9eff" stroke-width="2" fill="none" opacity="0.6"/>
      <!-- Body -->
      <path d="M30,40 L10,140 L40,200 L50,200 L50,140 Z" fill="#4a9eff" opacity="0.4"/>
      <path d="M70,40 L90,140 L60,200 L50,200 L50,140 Z" fill="#4a9eff" opacity="0.4"/>
      <!-- Shield arm -->
      <path d="M25,50 L-30,80 L-40,140 L-20,160 L0,120 L20,70 Z" fill="#4a9eff" opacity="0.5"/>
      <!-- Shield -->
      <ellipse cx="-30" cy="120" rx="35" ry="45" fill="#4a9eff" opacity="0.3" stroke="#4a9eff" stroke-width="2" opacity="0.5"/>
      <!-- Cape -->
      <path d="M70,50 C100,80 120,140 110,220 C90,200 80,160 70,140" fill="#4a9eff" opacity="0.2"/>
    </g>
    
  
  <!-- Particle effects -->
  <circle cx="150" cy="50" r="1.5" fill="#4a9eff" opacity="0.3"/>
  <circle cx="700" cy="80" r="1" fill="#4a9eff" opacity="0.4"/>
  <circle cx="250" cy="180" r="2" fill="#4a9eff" opacity="0.2"/>
  <circle cx="800" cy="200" r="1.5" fill="#4a9eff" opacity="0.3"/>
  <circle cx="500" cy="30" r="1" fill="#4a9eff" opacity="0.5"/>
</svg>